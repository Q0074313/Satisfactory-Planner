# Beispiel für den Betrieb mit PostgreSQL. Werte kommen aus der Umgebung bzw. einer
# lokalen .env-Datei (nicht einchecken; Vorlage: .env.example).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: satis
      POSTGRES_USER: satis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U satis']
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://satis:${POSTGRES_PASSWORD}@db:5432/satis
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET setzen (mind. 32 Zeichen)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - '8080:8080'
volumes:
  pgdata:
