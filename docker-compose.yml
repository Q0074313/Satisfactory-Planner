# Satis Planner auf dem Heimserver. Öffentlich erreichbar über Tailscale Funnel:
#   tailscale funnel --bg 8080
# Der Port ist nur auf 127.0.0.1 freigegeben – erreichbar für tailscaled auf
# demselben Rechner, nicht direkt aus dem Heimnetz oder Internet.
# Optionale Einstellungen in .env (Vorlage: .env.example).
services:
  app:
    build:
      context: .
      args:
        # Commit für die Versionsanzeige (setzt update.sh)
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: satis-planner:latest
    restart: unless-stopped
    environment:
      STORAGE_DIR: /app/storage
      # tailscaled leitet weiter und setzt X-Forwarded-For; nur lokalen Absendern glauben
      TRUST_PROXY: loopback,uniquelocal
      MAX_PROJECT_BYTES: ${MAX_PROJECT_BYTES:-5242880}
      MAX_PROJECTS: ${MAX_PROJECTS:-5000}
      RATE_CREATE_PER_HOUR: ${RATE_CREATE_PER_HOUR:-10}
      RATE_SAVE_PER_MINUTE: ${RATE_SAVE_PER_MINUTE:-120}
      RATE_LOAD_PER_MINUTE: ${RATE_LOAD_PER_MINUTE:-300}
    ports:
      - '127.0.0.1:${PORT:-8080}:8080'
    volumes:
      # Projekte (eine JSON-Datei pro Projekt) – überlebt Rebuilds und Updates
      - ./storage:/app/storage
    # Härtung: Dateisystem schreibgeschützt (außer storage und /tmp), keine Zusatzrechte
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
